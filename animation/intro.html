<!doctype html>
<!--
  Source for assets/intro.webp: an anime-style opening where a stick figure with a red
  scarf (Ziyang) runs through the places on his path.
  window.render(t) draws the frame at time t (seconds) on a canvas. capture.mjs steps t
  and screenshots each frame. Nothing reads the wall clock, so a capture is repeatable.
  Open the page in a browser to watch it live.
-->
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="cv" width="880" height="385"></canvas>
<script>
const W = 880, H = 385, DURATION = 25.8, FPS = 12;
const ctx = document.getElementById("cv").getContext("2d");

const DISPLAY = "'Avenir Next Condensed', 'Futura', sans-serif";
const MONO = "'SF Mono', Menlo, monospace";
const CJK = "'PingFang SC', 'Hiragino Sans GB', sans-serif";
const C = { ink: "#14121a", red: "#ff2e4d", yellow: "#ffd23f", cyan: "#3ad8ff", pink: "#ff5fa2",
            green: "#2ee59d", white: "#ffffff", navy: "#0b1024" };

const IMG = {};
for (const [k, src] of Object.entries({ uestc: "logos/uestc.png", bytedance: "logos/bytedance.svg",
                                        smartx: "logos/smartx.png", nus: "logos/nus.svg" })) {
  IMG[k] = new Image(); IMG[k].src = src;
}

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const backOut = p => { const c = 2.2; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
const rad = d => d * Math.PI / 180;
// Seeded hash, so "random" speed lines flicker per frame but repeat on every capture.
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function font(size, weight = 900, family = DISPLAY, italic = true) {
  return `${italic ? "italic " : ""}${weight} ${size}px ${family}`;
}

function bigText(s, x, y, size, { fill = C.white, stroke = C.ink, sw = 10, align = "center", skew = -.18,
                                 scale = 1, alpha = 1, family = DISPLAY, shadow = C.ink, italic = true } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.transform(1, 0, skew, 1, 0, 0);
  ctx.scale(scale, scale);
  ctx.font = font(size, 900, family, italic);
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, 6, 6); }
  if (sw) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = fill; ctx.fillText(s, 0, 0);
  ctx.restore();
}

function radialLines(cx, cy, n, color, frame, inner = 120, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + hash(i + frame * 7) * .05;
    const w = .006 + hash(i * 3 + frame) * .016;
    const r1 = inner + hash(i * 5 + frame * 3) * 120, r2 = 1100;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a - w) * r2, cy + Math.sin(a - w) * r2);
    ctx.lineTo(cx + Math.cos(a + w) * r2, cy + Math.sin(a + w) * r2);
    ctx.fill();
  }
  ctx.restore();
}

function hLines(n, color, frame, alpha = .6, dir = -1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const y = hash(i * 13) * H;
    const len = 80 + hash(i * 7) * 300;
    const x = ((hash(i * 3) * (W + 400) + dir * frame * 90) % (W + 400) + W + 400) % (W + 400) - 200;
    ctx.fillRect(x, y, len, 1.5 + hash(i) * 3);
  }
  ctx.restore();
}

function halftone(color, alpha = .12, step = 14) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  for (let y = 0; y < H; y += step) for (let x = (y / step) % 2 ? step / 2 : 0; x < W; x += step) {
    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function slab(y, h, color, p, angle = -6) {
  if (p <= 0) return;
  ctx.save();
  ctx.translate(lerp(-W * 1.3, 0, easeOut(p)), y);
  ctx.rotate(rad(angle));
  ctx.fillStyle = color; ctx.fillRect(-100, -h / 2, W + 300, h);
  ctx.fillStyle = C.ink; ctx.fillRect(-100, h / 2, W + 300, 5); ctx.fillRect(-100, -h / 2 - 5, W + 300, 5);
  ctx.restore();
}

function logoBadge(img, x, y, w, h, { p = 1, rot = -4, border = C.ink } = {}) {
  if (p <= 0) return;
  const s = backOut(p);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rad(rot)); ctx.scale(s, s);
  ctx.fillStyle = C.ink; roundRect(-w / 2 + 6, -h / 2 + 6, w, h, 12); ctx.fill();
  ctx.fillStyle = C.white; ctx.strokeStyle = border; ctx.lineWidth = 5;
  roundRect(-w / 2, -h / 2, w, h, 12); ctx.fill(); ctx.stroke();
  if (img.complete && img.naturalWidth) {
    const r = Math.min((w - 20) / img.naturalWidth, (h - 20) / img.naturalHeight);
    const iw = img.naturalWidth * r, ih = img.naturalHeight * r;
    ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// Anime lower-third: a slanted panel that slides in with the place, the role and the years.
function caption(t, t0, tag, title, sub, accent) {
  const p = prog(t, t0, .35);
  if (p <= 0) return;
  ctx.save();
  ctx.translate(lerp(-620, 0, easeOut(p)), 0);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(0, 292); ctx.lineTo(560, 292); ctx.lineTo(530, 362); ctx.lineTo(0, 362); ctx.fill();
  ctx.fillStyle = accent; ctx.fillRect(0, 286, 566, 7);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.font = `700 12px ${MONO}`; ctx.fillStyle = accent; ctx.fillText(tag, 24, 310);
  ctx.font = font(27); ctx.fillStyle = C.white; ctx.fillText(title, 24, 338);
  ctx.font = `600 12px ${MONO}`; ctx.fillStyle = "#b8c2dd"; ctx.fillText(sub, 24, 355);
  ctx.restore();
}

function flash(t, at, strength = .85, d = .17) {
  const k = t - at;
  if (k < 0 || k > d) return;
  ctx.save(); ctx.globalAlpha = strength * (1 - k / d); ctx.fillStyle = C.white; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function shockwave(x, y, t, at) {
  const k = (t - at) / .5;
  if (k < 0 || k > 1) return;
  ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = C.white; ctx.lineWidth = 8 * (1 - k) + 1;
  ctx.beginPath(); ctx.ellipse(x, y, 40 + 260 * easeOut(k), 10 + 50 * easeOut(k), 0, 0, 7); ctx.stroke();
  ctx.restore();
}

// ---------- the stick figure ----------
// Angles are in degrees from straight down; positive turns toward the way he faces.
// Elbow and knee angles are relative to the upper limb.
const POSE = {
  stand: () => ({ lean: 0, aL: [-14, 8], aR: [14, -8], lL: [-8, 0], lR: [8, 0] }),
  run: ph => { const s = Math.sin(ph); return { lean: 20, aL: [-55 * s, 80], aR: [55 * s, 80],
    lL: [48 * s, -12 - 70 * Math.max(0, -s)], lR: [-48 * s, -12 - 70 * Math.max(0, s)] }; },
  crouch: () => ({ lean: 25, aL: [-40, 60], aR: [50, 30], lL: [80, -120], lR: [-30, -60], drop: 26 }),
  hero: () => ({ lean: 4, aL: [-35, -70], aR: [165, 0], lL: [-22, 0], lR: [22, 0] }),
  cheer: () => ({ lean: -4, aL: [-150, 0], aR: [150, 0], lL: [-20, -10], lR: [25, -30] }),
  jump: () => ({ lean: -6, aL: [-150, -10], aR: [150, 10], lL: [40, -90], lR: [-20, -40] }),
  sit: ph => ({ lean: 8, aL: [70 + 6 * Math.sin(ph * 2.3), 30], aR: [70 + 6 * Math.sin(ph * 2.3 + 2), 30], lL: [85, -85], lR: [85, -85], drop: 14 }),
  carry: ph => { const s = Math.sin(ph); return { lean: 16, aL: [100, 40], aR: [100, 40],
    lL: [48 * s, -12 - 70 * Math.max(0, -s)], lR: [-48 * s, -12 - 70 * Math.max(0, s)] }; },
  fly: () => ({ lean: 82, aL: [92, 0], aR: [40, 20], lL: [-95, 0], lR: [-80, -20] }),
  point: () => ({ lean: 2, aL: [-20, 20], aR: [95, 0], lL: [-14, 0], lR: [16, 0] }),
};

function stick(x, y, s, pose, { face = 1, t = 0, scarf = true, cap = false, alpha = 1, color = C.ink, glow = null, outline = true } = {}) {
  const v = (a, len) => [Math.sin(rad(a)) * face * len * s, Math.cos(rad(a)) * len * s];
  const hip = [x, y - (60 - (pose.drop || 0)) * s];
  const up = v(180 - pose.lean, 1);
  const sh = [hip[0] + up[0] * 48, hip[1] + up[1] * 48];
  const hd = [sh[0] + up[0] * 19, sh[1] + up[1] * 19];
  const limb = (o, [a, b], l1, l2) => {
    const m = [o[0] + v(a, l1)[0], o[1] + v(a, l1)[1]];
    return [o, m, [m[0] + v(a + b, l2)[0], m[1] + v(a + b, l2)[1]]];
  };
  const parts = [[hip, sh], limb(sh, pose.aL, 24, 22), limb(sh, pose.aR, 24, 22), limb(hip, pose.lL, 30, 30), limb(hip, pose.lR, 30, 30)];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (scarf) {
    // Two tails trail behind the neck and ripple: the anime hero's tell.
    ctx.strokeStyle = C.red; ctx.lineWidth = 6 * s;
    for (let k = 0; k < 2; k++) {
      ctx.beginPath(); ctx.moveTo(sh[0], sh[1] - 4 * s);
      for (let i = 1; i <= 6; i++) {
        const px = sh[0] - face * i * 11 * s;
        const py = sh[1] - 4 * s + Math.sin(t * 14 + i * .9 + k * 1.7) * i * 2.2 * s + k * 7 * s + i * 1.5 * s;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
  if (outline) {
    // A white cel outline keeps him readable on dark backgrounds as well as light ones.
    ctx.strokeStyle = C.white; ctx.lineWidth = 12 * s;
    for (const seg of parts) { ctx.beginPath(); ctx.moveTo(...seg[0]); for (const p of seg.slice(1)) ctx.lineTo(...p); ctx.stroke(); }
    ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(hd[0], hd[1], 16.5 * s, 0, 7); ctx.fill();
  }
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 16; }
  ctx.strokeStyle = color; ctx.lineWidth = 7 * s;
  for (const seg of parts) { ctx.beginPath(); ctx.moveTo(...seg[0]); for (const p of seg.slice(1)) ctx.lineTo(...p); ctx.stroke(); }
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(hd[0], hd[1], 14 * s, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  // Eye: one white slash, looking forward.
  ctx.strokeStyle = C.white; ctx.lineWidth = 2.5 * s;
  ctx.beginPath(); ctx.moveTo(hd[0] + face * 4 * s, hd[1] - 3 * s); ctx.lineTo(hd[0] + face * 10 * s, hd[1] - 1 * s); ctx.stroke();
  if (scarf) { ctx.fillStyle = C.red; ctx.beginPath(); ctx.ellipse(sh[0], sh[1] - 3 * s, 9 * s, 5 * s, 0, 0, 7); ctx.fill(); }
  if (cap) drawCap(hd[0], hd[1] - 13 * s, s, 0);
  ctx.restore();
}

function drawCap(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = C.ink; ctx.fillRect(-9 * s, -4 * s, 18 * s, 8 * s);
  ctx.beginPath(); ctx.moveTo(-22 * s, -4 * s); ctx.lineTo(0, -12 * s); ctx.lineTo(22 * s, -4 * s); ctx.lineTo(0, 4 * s); ctx.fill();
  ctx.strokeStyle = C.yellow; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(0, -5 * s); ctx.lineTo(14 * s, 6 * s); ctx.stroke();
  ctx.restore();
}

// ---------- backgrounds and props ----------
function sky(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function cloud(x, y, s, color = "#fff", alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  for (const [dx, dy, r] of [[0, 0, 26], [28, -12, 32], [60, 0, 26], [30, 8, 24]]) { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); ctx.fill(); }
  ctx.restore();
}
function ground(y, color, line = C.ink) { ctx.fillStyle = color; ctx.fillRect(0, y, W, H - y); ctx.fillStyle = line; ctx.fillRect(0, y, W, 4); }

function gate(x, y, color) {
  ctx.fillStyle = C.ink; ctx.fillRect(x - 110, y - 170, 34, 170); ctx.fillRect(x + 76, y - 170, 34, 170);
  ctx.fillStyle = color; ctx.fillRect(x - 106, y - 166, 26, 166); ctx.fillRect(x + 80, y - 166, 26, 166);
  ctx.fillStyle = C.ink; ctx.fillRect(x - 130, y - 200, 260, 40);
  ctx.fillStyle = "#2b2140"; ctx.fillRect(x - 76, y - 160, 152, 160);
}

function monitor(x, y, w, h, draw) {
  ctx.fillStyle = C.ink; roundRect(x - 6, y - 6, w + 12, h + 12, 8); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); draw(x, y, w, h); ctx.restore();
  ctx.fillStyle = C.ink; ctx.fillRect(x + w / 2 - 6, y + h + 6, 12, 20); ctx.fillRect(x + w / 2 - 30, y + h + 24, 60, 6);
}

function desk(x, y, w) { ctx.fillStyle = C.ink; ctx.fillRect(x, y, w, 10); ctx.fillRect(x + 10, y, 8, H - y); ctx.fillRect(x + w - 18, y, 8, H - y); }

function chair(x, y) { ctx.fillStyle = C.ink; ctx.fillRect(x - 26, y - 6, 52, 8); ctx.fillRect(x - 4, y, 8, 50); ctx.fillRect(x - 28, y - 60, 7, 60); }

function vmBox(x, y, s, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = C.ink; ctx.fillRect(-16 * s + 3, -16 * s + 3, 32 * s, 32 * s);
  ctx.fillStyle = color; ctx.fillRect(-16 * s, -16 * s, 32 * s, 32 * s);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.strokeRect(-16 * s, -16 * s, 32 * s, 32 * s);
  ctx.fillStyle = C.ink; ctx.font = `800 ${12 * s}px ${MONO}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("VM", 0, 1);
  ctx.restore();
}

function rack(x, label, color, fill) {
  ctx.fillStyle = C.ink; ctx.fillRect(x - 70, 70, 140, 246);
  ctx.fillStyle = "#1f2b3a"; ctx.fillRect(x - 62, 78, 124, 230);
  for (let i = 0; i < 9; i++) {
    const on = i < fill;
    ctx.fillStyle = on ? color : "#2c3a4c"; ctx.fillRect(x - 54, 86 + i * 24, 108, 16);
    ctx.fillStyle = on ? "#fff" : "#46566c"; ctx.fillRect(x + 36, 92 + i * 24, 8, 4);
  }
  ctx.fillStyle = color; ctx.font = font(22); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(label, x, 58);
}

function bot(x, y, s, ph, carrying, color = C.cyan) {
  // A small agent robot: box head, antenna, stick legs.
  ctx.save(); ctx.translate(x, y); ctx.lineCap = "round";
  const b = Math.abs(Math.sin(ph)) * 4;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4 * s;
  ctx.beginPath(); ctx.moveTo(-6 * s, -2); ctx.lineTo(-6 * s + Math.sin(ph) * 6, 0); ctx.moveTo(6 * s, -2); ctx.lineTo(6 * s - Math.sin(ph) * 6, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6 * s, -18 * s); ctx.lineTo(-6 * s + Math.sin(ph) * 6, 0); ctx.moveTo(6 * s, -18 * s); ctx.lineTo(6 * s - Math.sin(ph) * 6, 0); ctx.stroke();
  ctx.fillStyle = color; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  roundRect(-16 * s, -48 * s - b, 32 * s, 30 * s, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.fillRect(-8 * s, -38 * s - b, 5 * s, 5 * s); ctx.fillRect(4 * s, -38 * s - b, 5 * s, 5 * s);
  ctx.beginPath(); ctx.moveTo(0, -48 * s - b); ctx.lineTo(0, -58 * s - b); ctx.stroke();
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(0, -60 * s - b, 4 * s, 0, 7); ctx.fill();
  if (carrying) paper(0, -92 * s - b, .45, 0, carrying);
  ctx.restore();
}

function paper(x, y, s, rot, color, title = "") {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = C.ink; ctx.fillRect(-46, -58, 98, 124);
  ctx.fillStyle = "#fbfbff"; ctx.fillRect(-50, -62, 98, 124);
  ctx.fillStyle = color; ctx.fillRect(-50, -62, 98, 22);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.strokeRect(-50, -62, 98, 124);
  ctx.fillStyle = "#c9cede"; for (let i = 0; i < 6; i++) ctx.fillRect(-40, -30 + i * 13, 78 - (i % 3) * 16, 5);
  if (title) { ctx.fillStyle = C.ink; ctx.font = `800 13px ${MONO}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(title, -1, -50); }
  ctx.restore();
}

function skyline(base, color) {
  ctx.fillStyle = color;
  const towers = [[40, 90, 40], [90, 140, 34], [130, 110, 46], [190, 170, 30], [230, 120, 40], [700, 130, 36], [745, 180, 30], [785, 100, 44], [835, 150, 40]];
  for (const [x, h, w] of towers) ctx.fillRect(x, base - h, w, h);
  // Marina Bay Sands: three towers and the sky park across them.
  for (const x of [400, 460, 520]) { ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x + 6, base - 150); ctx.lineTo(x + 36, base - 150); ctx.lineTo(x + 40, base); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(385, base - 162); ctx.lineTo(585, base - 168); ctx.lineTo(578, base - 152); ctx.lineTo(392, base - 150); ctx.fill();
  ctx.fillRect(0, base, W, H - base);
}

function sun(x, y, r, c1, c2) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

function stamp(x, y, text, color, p, rot = -12, size = 26) {
  if (p <= 0) return;
  const s = lerp(3, 1, easeOut(p));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rad(rot)); ctx.scale(s, s); ctx.globalAlpha = clamp(p * 3);
  ctx.font = font(size); const w = ctx.measureText(text).width + 26;
  ctx.fillStyle = "rgba(20,18,26,.75)"; ctx.fillRect(-w / 2, -size * .75, w, size * 1.5);
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(-w / 2, -size * .75, w, size * 1.5);
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 0, 2);
  ctx.restore();
}

function sfx(text, x, y, color, p, rot = -10, size = 34) {
  if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rad(rot));
  bigText(text, 0, 0, size, { fill: color, sw: 7, scale: backOut(clamp(p * 3)), alpha: p < .8 ? 1 : (1 - p) * 5, skew: -.25, shadow: null });
  ctx.restore();
}

// ---------- scenes ----------
const SCENES = [
  { from: 0, to: 2.6, draw: (t, g) => {          // OPENING: he drops in and the title slams down
    sky("#0d1230", "#0d1230");
    radialLines(200, 250, 70, "#ffffff", Math.floor(g * FPS), 90, .5);
    const land = .55;
    slab(195, 130, C.red, prog(t, .8, .3), -5);
    if (t < land) {
      const y = lerp(-90, 300, easeIn(t / land));
      ctx.save(); ctx.globalAlpha = .5; ctx.fillStyle = C.cyan; ctx.fillRect(196, y - 260, 8, 180); ctx.fillRect(178, y - 200, 4, 120); ctx.fillRect(220, y - 220, 4, 130); ctx.restore();
      stick(200, y, 1.15, POSE.jump(), { t });
    } else {
      shockwave(200, 300, t, land);
      ctx.fillStyle = C.ink; ctx.fillRect(0, 300, W, 4);
      stick(200, 300, 1.15, t < land + .35 ? POSE.crouch() : POSE.hero(), { t });
    }
    bigText("ZIYANG LIU", 540, 172, 104, { scale: lerp(2.6, 1, easeOut(prog(t, .95, .2))), alpha: prog(t, .95, .01) });
    ["刘", "子", "阳"].forEach((ch, i) => bigText(ch, 835, 70 + i * 74, 62, { fill: C.yellow, family: CJK, skew: 0, sw: 8, italic: false,
      alpha: prog(t, 1.25 + i * .1, .01), scale: backOut(prog(t, 1.25 + i * .1, .25)) }));
    const sp = prog(t, 1.6, .3);
    if (sp > 0) {
      ctx.save(); ctx.translate(lerp(W, 0, easeOut(sp)), 0);
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(320, 262); ctx.lineTo(790, 262); ctx.lineTo(778, 294); ctx.lineTo(308, 294); ctx.fill();
      ctx.font = `800 15px ${MONO}`; ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "middle";

        paper(lerp(tx + 300, tx, easeOut(p)), lerp(-120, ty, easeOut(p)), .62, rad(lerp(80, -6 + row * 5, easeOut(p))), c, lab);
        if (row === 2) {
          const lp = prog(tc, at + .3, .25);
          if (lp > 0) {
            const lx = 534 + col * 120;
            ctx.save(); ctx.globalAlpha = lp; ctx.fillStyle = c; ctx.fillRect(lx - 52, 196, 104, 32);
            ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
            ctx.font = `900 12px ${MONO}`; ctx.fillText(["LLM SYSTEMS", "ICLR 2027", "MATH"][col], lx, 210);
            ctx.font = `700 9px ${MONO}`; ctx.fillText(["ARXIV", "UNDER REVIEW", "ZENODO"][col], lx, 223);
            ctx.restore();
          }
        }
      });
      stamp(720, 270, "9 PAPERS", C.yellow, prog(tc, 2.75, .25), -8, 30);
      caption(tc, .1, "EP.5  RESEARCH", "AGENTS AS RESEARCH PARTNERS", "3 LLM SYSTEMS · 3 ICLR 2027 SUBMISSIONS · 3 MATH", C.pink);
    }
    flash(t, 1.0, .5); flash(t, 3.9, .5);
  }},
  { from: 24.2, to: 25.8, draw: (t, g) => {      // Finale: silhouette at sunset
    sky("#ff6b4a", "#2a0f3a");
    radialLines(440, 230, 50, "#ffd9a0", Math.floor(g * FPS / 2), 120, .35);
    sun(440, 240, 120, "#fff1c2", "#ff8a4a");
    ctx.fillStyle = "#1a0b24"; ctx.beginPath(); ctx.ellipse(440, 420, 520, 110, 0, 0, 7); ctx.fill();
    stick(440, 318, 1.5, POSE.hero(), { t, color: "#1a0b24", outline: false });
    bigText("ZIYANG LIU", 440, 66, 64, { scale: backOut(prog(t, .15, .3)), alpha: prog(t, .15, .01) });
    if (t > .45) { ctx.font = `800 14px ${MONO}`; ctx.fillStyle = C.white; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText("ZIY.BIO  ·  GITHUB.COM/ZIYANGLIU-666", 440, 116); }
    const p = prog(t, .6, .3);
    if (p > 0) {
      ctx.save(); ctx.translate(lerp(W + 200, 0, easeOut(p)), 0);
      ctx.fillStyle = C.yellow; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(620, 310); ctx.lineTo(830, 310); ctx.lineTo(856, 330); ctx.lineTo(830, 350); ctx.lineTo(620, 350); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.font = font(22); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("TO BE CONTINUED", 728, 331);
      ctx.restore();
    }
  }},
];
const CUTS = SCENES.slice(1).map(s => s.from);

window.render = function (t) {
  t = Math.floor(t * FPS + 1e-6) / FPS;         // animate on 12 fps, like hand-drawn anime
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  const s = SCENES.find(x => t >= x.from && t < x.to) || SCENES[SCENES.length - 1];
  s.draw(t - s.from, t);
  // A diagonal wipe crosses each cut.
  for (const c of CUTS) {
    const k = (t - c + .17) / .34;
    if (k < 0 || k > 1) continue;
    const x = lerp(-500, W + 200, k);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 380, 0); ctx.lineTo(x + 260, H); ctx.lineTo(x - 120, H); ctx.fill();
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(x + 380, 0); ctx.lineTo(x + 410, 0); ctx.lineTo(x + 290, H); ctx.lineTo(x + 260, H); ctx.fill();
  }
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 14); ctx.fillRect(0, H - 14, W, 14);
  const fade = Math.max(clamp(1 - t / .25), clamp((t - (DURATION - .3)) / .3));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = "#05060f"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
};

if (!location.search.includes("capture")) {
  const start = performance.now();
  const loop = () => { window.render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  Promise.all(Object.values(IMG).map(i => i.decode().catch(() => {}))).then(() => requestAnimationFrame(loop));
}
</script>
